name: Deploy Firestore rules (production)

# Runs after a merge to main that changes the rules. The "production" environment must be
# configured in GitHub (Settings > Environments) with you as a required reviewer, so every
# rules deployment waits for your approval.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g firebase-tools
      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Deploy rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only firestore:rules --project dispensium-agentic
